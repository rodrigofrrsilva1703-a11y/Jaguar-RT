name: Quality checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/rtav-http.log 2>&1 &
          sleep 2
      - run: npx playwright test

